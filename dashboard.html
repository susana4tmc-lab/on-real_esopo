<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ON-RE@L · Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --roxo: #4A148C; --roxo-c: #F3E5F5;
    --verde: #2E7D32; --verde-c: #E8F5E9;
    --amarelo: #F9A825; --amarelo-c: #FFFDE7;
    --vermelho: #C62828; --vermelho-c: #FFEBEE;
    --cinza: #546E7A; --cinza-c: #ECEFF1;
    --azul: #1565C0; --azul-c: #E3F2FD;
    --branco: #fff; --fundo: #F7F8FA; --texto: #1a1a2e; --borda: #dce0e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }

  /* LOGIN */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--roxo) 0%, #7B1FA2 100%);
  }
  .login-card {
    background: white; border-radius: 20px; padding: 40px 36px;
    width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    text-align: center;
  }
  .login-card h1 { font-size: 1.5rem; color: var(--roxo); margin-bottom: 6px; }
  .login-card p { font-size: .85rem; color: var(--cinza); margin-bottom: 28px; }
  .login-card input {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--borda);
    border-radius: 10px; font-size: 1rem; font-family: inherit;
    margin-bottom: 14px; letter-spacing: .1em; text-align: center;
  }
  .login-card input:focus { outline: none; border-color: var(--roxo); background: var(--roxo-c); }
  .login-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--roxo); color: white; font-size: 1rem; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: background .2s;
  }
  .login-btn:hover { background: #6A1B9A; }
  .login-erro { color: var(--vermelho); font-size: .82rem; margin-top: 10px; display: none; }

  /* DASHBOARD */
  .dash { display: none; }
  header {
    background: var(--roxo); color: white; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(74,20,140,.3);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header p { font-size: .75rem; opacity: .8; }
  .sair-btn {
    padding: 7px 16px; border: 1.5px solid rgba(255,255,255,.5);
    border-radius: 8px; background: transparent; color: white;
    font-size: .82rem; cursor: pointer; font-family: inherit;
  }
  .sair-btn:hover { background: rgba(255,255,255,.15); }

  main { padding: 20px 16px 60px; max-width: 1100px; margin: 0 auto; }

  /* FILTROS */
  .filtros {
    background: white; border-radius: 12px; border: 1px solid var(--borda);
    padding: 16px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
  }
  .filtro { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--cinza); }
  .filtro select, .filtro input {
    border: 1.5px solid var(--borda); border-radius: 8px; padding: 8px 10px;
    font-size: .85rem; font-family: inherit; background: var(--fundo); min-width: 140px;
  }
  .filtro select:focus, .filtro input:focus { outline: none; border-color: var(--roxo); }
  .filtrar-btn {
    padding: 9px 18px; border: none; border-radius: 8px; background: var(--roxo);
    color: white; font-size: .85rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .limpar-filtros {
    padding: 9px 18px; border: 1.5px solid var(--borda); border-radius: 8px;
    background: white; color: var(--cinza); font-size: .85rem; cursor: pointer; font-family: inherit;
  }

  /* TOTAIS */
  .totais {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .total-card {
    background: white; border-radius: 12px; border: 1px solid var(--borda);
    padding: 16px; text-align: center;
  }
  .total-card .num { font-size: 2rem; font-weight: 700; color: var(--roxo); }
  .total-card .label { font-size: .75rem; color: var(--cinza); margin-top: 4px; }

  /* TABELA */
  .tabela-wrap {
    background: white; border-radius: 12px; border: 1px solid var(--borda);
    overflow: hidden; margin-bottom: 16px;
  }
  .tabela-header {
    padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--borda);
  }
  .tabela-header h2 { font-size: .95rem; color: var(--roxo); font-weight: 700; }
  .export-dash-btn {
    padding: 8px 16px; border: none; border-radius: 8px; background: var(--verde);
    color: white; font-size: .82rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .tabela-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th {
    background: var(--roxo-c); color: var(--roxo); font-weight: 700;
    padding: 10px 12px; text-align: left; white-space: nowrap;
    border-bottom: 2px solid var(--roxo);
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--fundo); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: .72rem; font-weight: 700;
  }
  .badge-verm { background: var(--vermelho-c); color: var(--vermelho); }
  .badge-amar { background: var(--amarelo-c); color: var(--amarelo); }
  .badge-verd { background: var(--verde-c); color: var(--verde); }
  .sem-dados { padding: 40px; text-align: center; color: var(--cinza); font-size: .9rem; }

  /* LOADING */
  .loading { padding: 40px; text-align: center; color: var(--cinza); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--borda);
    border-top-color: var(--roxo); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <h1>ON-RE@L</h1>
    <p>Dashboard · Equipa de Coordenação</p>
    <input type="password" id="pwd-input" placeholder="Palavra-passe" onkeydown="if(event.key==='Enter')entrar()">
    <button class="login-btn" onclick="entrar()">Entrar</button>
    <div class="login-erro" id="login-erro">Palavra-passe incorrecta</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashboard">
  <header>
    <div>
      <h1>ON-RE@L · Dashboard</h1>
      <p>Dados agregados de todas as escolas</p>
    </div>
    <button class="sair-btn" onclick="sair()">Sair</button>
  </header>

  <main>
    <div class="filtros">
      <div class="filtro">
        <label>Sessão</label>
        <select id="f-sessao">
          <option value="">Todas</option>
          <option value="Sessão 1 — A Raposa e o Corvo">Sessão 1 — Raposa e Corvo</option>
          <option value="Sessão 2 — O Nome Secreto">Sessão 2 — Nome Secreto</option>
        </select>
      </div>
      <div class="filtro">
        <label>Agrupamento</label>
        <select id="f-agrupamento"><option value="">Todos</option></select>
      </div>
      <div class="filtro">
        <label>Escola</label>
        <select id="f-escola"><option value="">Todas</option></select>
      </div>
      <div class="filtro">
        <label>Data início</label>
        <input type="date" id="f-data-ini">
      </div>
      <div class="filtro">
        <label>Data fim</label>
        <input type="date" id="f-data-fim">
      </div>
      <button class="filtrar-btn" onclick="aplicarFiltros()">Filtrar</button>
      <button class="limpar-filtros" onclick="limparFiltros()">Limpar</button>
    </div>

    <div class="totais" id="totais"></div>

    <div class="tabela-wrap">
      <div class="tabela-header">
        <h2>Sessões registadas</h2>
        <button class="export-dash-btn" onclick="exportarExcel()">⬇ Exportar Excel</button>
      </div>
      <div id="tabela-content" class="loading">
        <div class="spinner"></div>
        <p>A carregar dados...</p>
      </div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://mpqxovtheecoqbermucw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KjsZpTVoyV1J5I2371siYg_sSMjRnaQ';
const PASSWORD = 'ONREAL2026';

let dadosCompletos = [];
let dadosFiltrados = [];

// ── LOGIN ─────────────────────────────────────────────────────
function entrar() {
  const pwd = document.getElementById('pwd-input').value;
  if (pwd === PASSWORD) {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    carregarDados();
  } else {
    document.getElementById('login-erro').style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

function sair() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pwd-input').value = '';
}

// ── CARREGAR DADOS ────────────────────────────────────────────
async function carregarDados() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/grelhas?select=*&order=criado_em.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    dadosCompletos = await r.json();
    dadosFiltrados = [...dadosCompletos];
    popularFiltros();
    renderizar();
  } catch(e) {
    document.getElementById('tabela-content').innerHTML =
      '<div class="sem-dados">Erro ao carregar dados. Verifica a ligação.</div>';
  }
}

function popularFiltros() {
  const agrup = [...new Set(dadosCompletos.map(d => d.agrupamento).filter(Boolean))].sort();
  const escolas = [...new Set(dadosCompletos.map(d => d.escola).filter(Boolean))].sort();
  const selA = document.getElementById('f-agrupamento');
  const selE = document.getElementById('f-escola');
  agrup.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; selA.appendChild(o); });
  escolas.forEach(e => { const o = document.createElement('option'); o.value = e; o.textContent = e; selE.appendChild(o); });
}

// ── FILTROS ───────────────────────────────────────────────────
function aplicarFiltros() {
  const sess  = document.getElementById('f-sessao').value;
  const agrup = document.getElementById('f-agrupamento').value;
  const esc   = document.getElementById('f-escola').value;
  const dIni  = document.getElementById('f-data-ini').value;
  const dFim  = document.getElementById('f-data-fim').value;

  dadosFiltrados = dadosCompletos.filter(d => {
    if (sess  && d.sessao !== sess) return false;
    if (agrup && d.agrupamento !== agrup) return false;
    if (esc   && d.escola !== esc) return false;
    if (dIni  && d.data_sessao < dIni) return false;
    if (dFim  && d.data_sessao > dFim) return false;
    return true;
  });
  renderizar();
}

function limparFiltros() {
  ['f-sessao','f-agrupamento','f-escola','f-data-ini','f-data-fim']
    .forEach(id => document.getElementById(id).value = '');
  dadosFiltrados = [...dadosCompletos];
  renderizar();
}

// ── RENDERIZAR ────────────────────────────────────────────────
function renderizar() {
  renderTotais();
  renderTabela();
}

function renderTotais() {
  const d = dadosFiltrados;
  const totalSessoes = d.length;
  const totalAlunos  = d.reduce((s, r) => s + (parseInt(r.n_alunos) || 0), 0);
  const escolas      = new Set(d.map(r => r.escola).filter(Boolean)).size;
  const agrupamentos = new Set(d.map(r => r.agrupamento).filter(Boolean)).size;

  document.getElementById('totais').innerHTML = `
    <div class="total-card"><div class="num">${totalSessoes}</div><div class="label">Sessões registadas</div></div>
    <div class="total-card"><div class="num">${totalAlunos}</div><div class="label">Alunos avaliados</div></div>
    <div class="total-card"><div class="num">${escolas}</div><div class="label">Escolas</div></div>
    <div class="total-card"><div class="num">${agrupamentos}</div><div class="label">Agrupamentos</div></div>
  `;
}

function renderTabela() {
  if (!dadosFiltrados.length) {
    document.getElementById('tabela-content').innerHTML =
      '<div class="sem-dados">Nenhuma sessão encontrada com os filtros seleccionados.</div>';
    return;
  }

  const linhas = dadosFiltrados.map(d => {
    const s2r = (d.s2_vermelho||0) + (d.s2_amarelo||0);
    const s4r = (d.s4_vermelho||0) + (d.s4_amarelo||0);
    const total = d.n_alunos || 1;
    const alerta = Math.round(((s2r + s4r) / (total * 2)) * 100);

    return `<tr>
      <td>${(d.criado_em||'').slice(0,10)}</td>
      <td>${d.sessao||''}</td>
      <td>${d.agrupamento||''}</td>
      <td>${d.escola||''}</td>
      <td>${d.turma||''}</td>
      <td>${d.n_alunos||''}</td>
      <td>${d.facilitadora||''}</td>
      <td>
        <span class="badge badge-verm">V ${d.s2_vermelho||0}</span>
        <span class="badge badge-amar">A ${d.s2_amarelo||0}</span>
        <span class="badge badge-verd">V ${d.s2_verde||0}</span>
      </td>
      <td>
        <span class="badge badge-verm">V ${d.s4_vermelho||0}</span>
        <span class="badge badge-amar">A ${d.s4_amarelo||0}</span>
        <span class="badge badge-verd">V ${d.s4_verde||0}</span>
      </td>
      <td><strong>${alerta}%</strong></td>
      <td>${d.envolvimento||'—'}</td>
      <td style="max-width:200px;white-space:normal;">${d.notas||''}</td>
    </tr>`;
  }).join('');

  document.getElementById('tabela-content').innerHTML = `
    <div class="tabela-scroll">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Sessão</th>
            <th>Agrupamento</th>
            <th>Escola</th>
            <th>Turma</th>
            <th>Alunos</th>
            <th>Facilitadora</th>
            <th>S2 — Alerta adulto</th>
            <th>S4 — Elogio+Segredo</th>
            <th>% Alerta</th>
            <th>Envolvimento</th>
            <th>Notas</th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`;
}

// ── EXPORTAR ──────────────────────────────────────────────────
function exportarExcel() {
  const rows = [['Data','Sessão','Agrupamento','Escola','Turma','N.º Alunos','Facilitadora',
    'S1 Verm','S1 Amar','S1 Verde','S1 Hesit.','S1 Verbal',
    'S2 Verm','S2 Amar','S2 Verde','S2 Hesit.','S2 Rec.','S2 Verbal',
    'S3 Verm','S3 Amar','S3 Verde','S3 Hesit.','S3 Verbal',
    'S4 Verm','S4 Amar','S4 Verde','S4 Hesit.','S4 Rec.','S4 Verbal',
    'Envolvimento','Notas',
    'Sin1 Cód.','Sin1 Comport.','Sin1 Acomp.',
    'Sin2 Cód.','Sin2 Comport.','Sin2 Acomp.',
    'Sin3 Cód.','Sin3 Comport.','Sin3 Acomp.']];

  dadosFiltrados.forEach(d => rows.push([
    (d.criado_em||'').slice(0,10), d.sessao, d.agrupamento, d.escola, d.turma, d.n_alunos, d.facilitadora,
    d.s1_vermelho, d.s1_amarelo, d.s1_verde, d.s1_hesitacao, d.s1_verbal,
    d.s2_vermelho, d.s2_amarelo, d.s2_verde, d.s2_hesitacao, d.s2_reconhecimento, d.s2_verbal,
    d.s3_vermelho, d.s3_amarelo, d.s3_verde, d.s3_hesitacao, d.s3_verbal,
    d.s4_vermelho, d.s4_amarelo, d.s4_verde, d.s4_hesitacao, d.s4_reconhecimento, d.s4_verbal,
    d.envolvimento, d.notas,
    d.sin1_codigo, d.sin1_comportamento, d.sin1_acompanhamento,
    d.sin2_codigo, d.sin2_comportamento, d.sin2_acompanhamento,
    d.sin3_codigo, d.sin3_comportamento, d.sin3_acompanhamento
  ]));

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = rows[0].map(() => ({ wch: 16 }));
  XLSX.utils.book_append_sheet(wb, ws, 'Grelhas ON-RE@L');
  XLSX.writeFile(wb, 'ONREAL_Dashboard_' + new Date().toISOString().slice(0,10) + '.xlsx');
}
</script>
</body>
</html>
